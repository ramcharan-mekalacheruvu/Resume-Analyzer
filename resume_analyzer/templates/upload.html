{% extends "base.html" %}

{% block content %}

<div class="upload-container">

    <h1>Upload Your Resume</h1>

    <p>
        Upload your resume in PDF or DOCX format.
    </p>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Analyze Resume
        </button>

    </form>

    {% if form.errors %}
        <div>
            {{ form.errors }}
        </div>
    {% endif %}

</div>

{% endblock %}
