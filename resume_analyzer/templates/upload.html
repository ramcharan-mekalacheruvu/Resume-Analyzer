{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="card">
        <div class="card-body">
            <h1 class="mb-4">
                Analyze Your Resume
            </h1>
            <p>
                Upload your resume in PDF or DOCX format.
            </p>
            <form
                method="POST"
                enctype="multipart/form-data"
            >
                {% csrf_token %}
                {{ form.as_p }}
                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Analyze Resume
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
